<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080508">
  <title>Lorilay!</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ui-font: 'Manrope', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      --ink: #f6ecef;
      --muted: #a89ba2;
      --dim: #7c6f76;
      --rose: #ff9db4;
      --panel: rgba(21, 15, 19, .74);
      --line: rgba(255, 255, 255, .09);
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: radial-gradient(circle at 50% 42%, #30131e 0%, #170b13 38%, #080508 78%);
      font-family: Arial, sans-serif;
    }
    [hidden] { display: none !important; }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #rose {
      position: fixed;
      inset: 0;
      z-index: 1;
      cursor: grab;
      touch-action: none;
    }
    #rose:active { cursor: grabbing; }

    /* ---------- Intro ---------- */
    #intro {
      position: fixed;
      z-index: 4;
      inset: 0;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      padding: 32px 24px;
      background: radial-gradient(circle at 50% 45%, #131b23 0%, #090d13 45%, #030406 100%);
      color: #f9e9ed;
      text-align: center;
    }
    #intro-message {
      min-height: 3em;
      width: min(760px, 100%);
      font: 600 clamp(18px, 3vw, 30px)/1.6 Georgia, serif;
      letter-spacing: .13em;
      text-shadow: 0 0 10px #fff8, 0 0 32px #d792ab55;
    }
    #intro-message .word {
      display: inline-block;
      opacity: 0;
      filter: blur(7px);
      transform: translateY(12px) scale(.96);
      transition: opacity .8s ease, filter .8s ease, transform .8s cubic-bezier(.2,.8,.2,1);
    }
    #intro-message .word.shown {
      opacity: 1;
      filter: blur(0);
      transform: none;
    }
    #intro-button {
      opacity: 0;
      transform: translateY(8px);
      pointer-events: none;
      transition: opacity .5s ease, transform .5s ease;
      padding: 12px 30px;
      border: 1px solid #f2b7d5aa;
      background: #713882;
      color: #ffe4e7;
      font: 600 12px Arial, sans-serif;
      letter-spacing: .03em;
      cursor: pointer;
      backdrop-filter: blur(12px);
      box-shadow: 0 0 24px #a85dc888;
    }
    #intro-button:hover, #intro-button:focus-visible { filter: brightness(1.15); outline-color: #ff9ca8; }
    #intro.ready #intro-button {
      opacity: 1;
      transform: none;
      pointer-events: auto;
    }

    /* ---------- Dock: start button, player, playlist ---------- */
    #audio-dock {
      position: fixed;
      z-index: 3;
      left: 0;
      right: 0;
      bottom: calc(20px + env(safe-area-inset-bottom, 0px));
      box-sizing: border-box;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      font-family: var(--ui-font);
      pointer-events: none;
    }
    #audio-dock > * { pointer-events: auto; }

    #sound-hint {
      color: #ffdbe4;
      font: 600 11px var(--ui-font);
      letter-spacing: .24em;
      text-transform: lowercase;
      text-shadow: 0 0 16px #f37b9a88;
    }

    .start-btn {
      all: unset;
      box-sizing: border-box;
      position: relative;
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      color: #fff;
      background: linear-gradient(145deg, #c94a6f, #8f2a4a);
      box-shadow: inset 0 0 0 1px #ffffff30, 0 10px 34px #da5f8977;
      cursor: pointer;
      transition: transform .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .start-btn:hover { transform: scale(1.06); }
    .start-btn:active { transform: scale(.96); }
    .start-btn svg { width: 26px; height: 26px; margin-left: 3px; fill: currentColor; }
    .start-btn::after {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid #ff9fb8;
      opacity: 0;
      animation: ring 2.8s ease-out infinite;
    }
    @keyframes ring {
      0%   { transform: scale(.88); opacity: .55; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    .start-btn:focus-visible, .ctl:focus-visible, .track:focus-visible {
      outline: 2px solid #ffb3c4;
      outline-offset: 3px;
    }

    /* Player card */
    .player {
      box-sizing: border-box;
      width: min(360px, 100%);
      padding: 14px 16px 10px;
      border-radius: 22px;
      border: 1px solid var(--line);
      background: var(--panel);
      box-shadow: 0 18px 50px #0009;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      color: var(--ink);
      animation: rise .55s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    .now { display: flex; align-items: center; gap: 12px; }
    .cover {
      flex: 0 0 44px;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 11px;
      background: radial-gradient(circle at 35% 30%, #e87893, #682039 68%, #25121e);
      box-shadow: inset 0 0 0 1px #ffffff22;
    }
    .meta { min-width: 0; flex: 1; }
    .meta .title, .meta .artist {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .meta .title { font-weight: 700; font-size: 14px; line-height: 1.3; }
    .meta .artist { margin-top: 2px; font-size: 12px; font-weight: 500; color: var(--muted); }

    .seek { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    .seek time {
      flex: 0 0 auto;
      min-width: 32px;
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .seek time:last-child { text-align: right; }
    #seek {
      -webkit-appearance: none;
      appearance: none;
      flex: 1;
      min-width: 0;
      height: 18px;
      margin: 0;
      background: transparent;
      cursor: pointer;
      --p: 0%;
    }
    #seek:disabled { opacity: .5; cursor: default; }
    #seek:focus-visible { outline: none; }
    #seek::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 3px;
      background: linear-gradient(to right, #ffc2d1 var(--p), #ffffff2e var(--p));
    }
    #seek::-moz-range-track { height: 3px; border-radius: 3px; background: #ffffff2e; }
    #seek::-moz-range-progress { height: 3px; border-radius: 3px; background: #ffc2d1; }
    #seek::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 11px;
      height: 11px;
      margin-top: -4px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 4px #ffffff1f;
      transform: scale(0);
      transition: transform .15s ease;
    }
    #seek::-moz-range-thumb {
      width: 11px;
      height: 11px;
      border: 0;
      border-radius: 50%;
      background: #fff;
      transform: scale(0);
      transition: transform .15s ease;
    }
    #seek:hover::-webkit-slider-thumb, #seek:focus-visible::-webkit-slider-thumb, #seek:active::-webkit-slider-thumb { transform: scale(1); }
    #seek:hover::-moz-range-thumb, #seek:focus-visible::-moz-range-thumb, #seek:active::-moz-range-thumb { transform: scale(1); }

    .controls {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 4px;
    }
    .ctl {
      all: unset;
      box-sizing: border-box;
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      color: #e9dde1;
      cursor: pointer;
      transition: background .2s ease, color .2s ease, transform .15s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .ctl:hover { background: #ffffff14; color: #fff; }
    .ctl:active { transform: scale(.93); }
    .ctl svg { width: 20px; height: 20px; fill: currentColor; }
    .ctl.main { width: 48px; height: 48px; background: #f6ecef; color: #1a0f14; }
    .ctl.main:hover { background: #fff; color: #000; }
    .ctl.main svg { width: 22px; height: 22px; }
    .ctl.list { position: absolute; right: -6px; }
    .ctl.list[aria-expanded="true"] { color: var(--rose); background: #ff9db41f; }
    .ctl.gesture { position: absolute; left: -6px; }
    .ctl.gesture[aria-pressed="true"] { color: var(--rose); background: #ff9db41f; }
    .ctl.gesture::after {
      content: '';
      position: absolute;
      top: 8px;
      right: 8px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #7dffb0;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .ctl.gesture.seen::after { opacity: 1; }
    .note {
      position: fixed;
      left: 50%;
      top: calc(18px + env(safe-area-inset-top, 0px));
      transform: translate(-50%, -6px);
      padding: 7px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      color: #ffdbe4;
      font: 600 12px var(--ui-font);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none !important;
      transition: opacity .25s ease, transform .25s ease;
    }
    .note.show { opacity: 1; transform: translate(-50%, 0); }
    .ctl.sm { width: 32px; height: 32px; }
    .ctl.sm svg { width: 16px; height: 16px; }

    .i-pause { display: none; }
    .is-playing .i-play { display: none; }
    .is-playing .i-pause { display: block; }

    /* Equalizer bars (cover + active track) */
    .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; color: var(--rose); }
    .eq i {
      display: block;
      width: 3px;
      height: 100%;
      border-radius: 2px;
      background: currentColor;
      transform: scaleY(.25);
      transform-origin: bottom;
    }
    .is-playing .eq i { animation: eq 1.2s ease-in-out infinite; }
    .eq i:nth-child(2) { animation-delay: -.45s; }
    .eq i:nth-child(3) { animation-delay: -.85s; }
    @keyframes eq {
      0%, 100% { transform: scaleY(.25); }
      50%      { transform: scaleY(1); }
    }
    .cover .eq { height: 20px; gap: 3px; color: #ffe7ed; }
    .cover .eq i { width: 4px; }

    /* Playlist (hideable) */
    .playlist {
      box-sizing: border-box;
      width: min(360px, 100%);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 20px;
      background: var(--panel);
      box-shadow: 0 18px 50px #0009;
      -webkit-backdrop-filter: blur(18px);
      backdrop-filter: blur(18px);
      color: var(--ink);
      max-height: 0;
      margin-bottom: -12px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: max-height .4s cubic-bezier(.4,0,.2,1), margin .4s cubic-bezier(.4,0,.2,1),
        opacity .3s ease, transform .4s cubic-bezier(.4,0,.2,1), visibility 0s linear .4s;
    }
    .playlist.open {
      max-height: min(44vh, 312px);
      margin-bottom: 0;
      opacity: 1;
      visibility: visible;
      transform: none;
      border-color: var(--line);
      transition-delay: 0s;
    }
    .pl-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 10px 4px 18px;
    }
    .pl-head h2 { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .02em; color: var(--ink); }
    .pl-head h2 span { margin-left: 8px; font-weight: 500; color: var(--dim); }
    .pl-list {
      position: relative;
      flex: 1;
      min-height: 0;
      margin: 0;
      padding: 2px 8px 10px;
      list-style: none;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #ffffff30 transparent;
    }
    .track {
      all: unset;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 9px 10px;
      border-radius: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .track:hover { background: #ffffff0d; color: var(--ink); }
    .track .idx, .track .eq { flex: 0 0 20px; justify-content: center; }
    .track .idx { font-size: 11px; font-weight: 600; text-align: center; color: var(--dim); font-variant-numeric: tabular-nums; }
    .track .eq { display: none; }
    .track.active .idx { display: none; }
    .track.active .eq { display: inline-flex; }
    .t-meta { min-width: 0; flex: 1; }
    .t-title, .t-artist { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .t-title { font-size: 13px; font-weight: 600; }
    .t-artist { margin-top: 1px; font-size: 11.5px; font-weight: 500; color: var(--dim); }
    .track.active .t-title { color: #fff; }
    .track.active .t-artist { color: var(--rose); }
    .track.missing { opacity: .35; }

    /* On wide screens the playlist is a side panel so it never covers the rose */
    @media (min-width: 900px) {
      .playlist {
        position: fixed;
        right: 24px;
        bottom: calc(20px + env(safe-area-inset-bottom, 0px));
        width: 300px;
        margin-bottom: 0;
        transform: translateX(18px);
      }
      .playlist.open { max-height: min(70vh, 420px); transform: none; }
    }
    @media (max-width: 420px) {
      #intro-message { font-size: 18px; letter-spacing: .08em; }
    }
    @media (prefers-reduced-motion: reduce) {
      #intro-button, #intro-message .word, .playlist, .ctl, .track, .start-btn { transition: none; }
      .eq i, .start-btn::after, .player { animation: none !important; }
    }
  </style>
</head>
<body>
  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M8.2 5.2c-.7-.4-1.7.1-1.7 1v11.6c0 .9 1 1.4 1.7 1l9.8-5.8c.7-.4.7-1.5 0-1.9z"/></symbol>
      <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6.2" y="5" width="4" height="14" rx="1.3"/><rect x="13.8" y="5" width="4" height="14" rx="1.3"/></symbol>
      <symbol id="i-prev" viewBox="0 0 24 24"><rect x="5" y="5.2" width="2.4" height="13.6" rx="1.2"/><path d="M18.6 6.2v11.6c0 .8-.9 1.3-1.6.9l-8.4-5.8c-.6-.4-.6-1.2 0-1.6L17 5.3c.7-.5 1.6 0 1.6.9z"/></symbol>
      <symbol id="i-next" viewBox="0 0 24 24"><g transform="translate(24 0) scale(-1 1)"><rect x="5" y="5.2" width="2.4" height="13.6" rx="1.2"/><path d="M18.6 6.2v11.6c0 .8-.9 1.3-1.6.9l-8.4-5.8c-.6-.4-.6-1.2 0-1.6L17 5.3c.7-.5 1.6 0 1.6.9z"/></g></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6.5h16M4 11.5h16M4 16.5h7" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M15 14.2v5.2c0 .5.5.8.9.5l3.9-2.6c.4-.3.4-.8 0-1.1l-3.9-2.6c-.4-.3-.9 0-.9.5z"/></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></g></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>
    </defs>
  </svg>

  <canvas id="rose" role="img" aria-label="A slowly turning red rose made entirely from the repeated word Lorilay!"></canvas>
  <div id="intro" aria-label="Apaka busy mo be, wala ka nang time, sakalin kita e">
    <div id="intro-message" aria-hidden="true"></div>
    <button id="intro-button" type="button">For you ✦</button>
  </div>

  <div id="audio-dock">
    <div id="gesture-note" class="note" role="status" aria-live="polite"></div>
    <div id="sound-hint">press play · sound on</div>
    <button id="start-audio" class="start-btn" type="button" aria-label="Play">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-play"/></svg>
    </button>

    <aside id="playlist" class="playlist" aria-label="Playlist" inert>
      <div class="pl-head">
        <h2>Playlist<span id="pl-count"></span></h2>
        <button id="pl-close" class="ctl sm" type="button" aria-label="Hide playlist">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-close"/></svg>
        </button>
      </div>
      <ul id="pl-list" class="pl-list"></ul>
    </aside>

    <section id="mini-player" class="player" role="group" aria-label="Music player" hidden>
      <div class="now">
        <div class="cover" aria-hidden="true"><span class="eq"><i></i><i></i><i></i></span></div>
        <div class="meta"><span class="title" id="track-title"></span><span class="artist" id="track-artist"></span></div>
      </div>
      <div class="seek">
        <time id="elapsed">0:00</time>
        <input id="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek" disabled>
        <time id="duration">0:00</time>
      </div>
      <div class="controls">
        <button id="toggle-gesture" class="ctl gesture" type="button" aria-label="Turn on hand swipe control" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-hand"/></svg>
        </button>
        <button id="prev" class="ctl" type="button" aria-label="Previous track">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-prev"/></svg>
        </button>
        <button id="toggle-audio" class="ctl main" type="button" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-play"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-pause"/></svg>
        </button>
        <button id="next" class="ctl" type="button" aria-label="Next track">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-next"/></svg>
        </button>
        <button id="toggle-list" class="ctl list" type="button" aria-label="Show playlist" aria-expanded="false" aria-controls="playlist">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><use href="#i-list"/></svg>
        </button>
      </div>
    </section>
  </div>

  <button id="resume" type="button" hidden tabindex="-1" aria-hidden="true"></button>
  <audio id="song" preload="metadata"></audio>

  <script>
    (() => {
      // oh bat chinecheck mo source code ko, akala ko ba busy ka, nakakapagod na, maghihintay ka maghapon tas tutulugan ka lang, block mo na lang ako taeng yan
      const WORD = 'Lorilay!';
      const ASPECT = 3.2;
      const canvas = document.getElementById('rose');
      const ctx = canvas.getContext('2d', { alpha: true });
      canvas.dataset.motion = 'running';
      const introScreen = document.getElementById('intro');
      const introMessage = document.getElementById('intro-message');
      const introButton = document.getElementById('intro-button');
      const introWords = 'Apaka busy mo be, wala ka nang time, sakalin kita e'.split(' ');
      const introStart = performance.now() + 300;
      const resumeButton = document.getElementById('resume');
      const song = document.getElementById('song');
      const dock = document.getElementById('audio-dock');
      const soundHint = document.getElementById('sound-hint');
      const startAudioButton = document.getElementById('start-audio');
      const miniPlayer = document.getElementById('mini-player');
      const toggleAudioButton = document.getElementById('toggle-audio');
      const prevButton = document.getElementById('prev');
      const nextButton = document.getElementById('next');
      const listButton = document.getElementById('toggle-list');
      const titleLabel = document.getElementById('track-title');
      const artistLabel = document.getElementById('track-artist');
      const elapsedLabel = document.getElementById('elapsed');
      const durationLabel = document.getElementById('duration');
      const seek = document.getElementById('seek');
      const playlist = document.getElementById('playlist');
      const playlistClose = document.getElementById('pl-close');
      const playlistList = document.getElementById('pl-list');
      const playlistCount = document.getElementById('pl-count');
      const phrases = ['ayaw na ba', 'cold mo na e', 'block mo na kaya be?', 'ang cold', 'hinintay maghapon', 'ayos lang if may bago na', 'halata naman e'];
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

      const redShades = ['#8c0e22', '#a90f27', '#c81530', '#dc2338', '#ec3446', '#f24d58', '#ff6970'];
      const greenShades = ['#25543b', '#326e48', '#408b55', '#55a969'];
      const coreShades = ['#a93525', '#c7512b', '#df7134', '#e99a49'];

      const clamp = (value, low, high) => Math.max(low, Math.min(high, value));
      const clamp01 = value => clamp(value, 0, 1);

      // Each colored image contains only the same word on transparency.
      function wordImage(color) {
        const image = document.createElement('canvas');

          halo.addColorStop(0,'rgba(179,58,102,.14)');halo.addColorStop(.55,'rgba(95,45,105,.06)');halo.addColorStop(1,'rgba(0,0,0,0)');
          ctx.fillStyle=halo;ctx.fillRect(0,0,width,height);
          for(let i=0;i<38;i++) {
            ctx.globalAlpha=reducedMotion ? .25 : .2+.15*Math.sin(sceneTime*.00045+i);
            ctx.fillStyle='#e9bbd0';ctx.beginPath();ctx.arc(((i*137.508)%100)/100*width,((i*73.31)%100)/100*height,i%3===0?1.1:.6,0,Math.PI*2);ctx.fill();
          }
          ctx.restore();
        }
        if (!started) return;


        for (const entry of drawOrder) {
          entry.pose = bloomPose(entry.item, bloom);
          entry.depth = rotate(roseMotion(entry.pose.position)).z;
        }
        // One camera-space painter queue: every particle can pass behind or
        // between the rose's word surfaces, including during manual rotation.
        const sceneOrder = drawOrder.concat(
          wordRain.map(drop => ({ drop, depth: rotate(rainPosition(drop)).z })),
          petalGate > 0 ? fallingPetals.map(petal => ({ petal, depth: rotate(vec(petal.x, petal.y, petal.z)).z })) : []
        );
        sceneOrder.sort((a, b) => a.depth - b.depth);
        for (const entry of sceneOrder) {
          if (entry.drop) { paintWordRain(entry.drop); continue; }
          if (entry.petal) { paintFallingPetal(entry.petal); continue; }
          const { item, pose } = entry;
          if (pose.alpha < .012) continue;
          const pulse = item.part === 'petal' ? 1 + Math.sin(sceneTime * .0008) * .012 : 1;
          const scaledWidth = item.width * pose.size * pulse;
          const p = project(rotate(roseMotion(pose.position)));
          const right = project(rotate(roseMotion(add(pose.position, scale(item.along, scaledWidth)))));
          const up = project(rotate(roseMotion(add(pose.position, scale(item.side, scaledWidth / ASPECT)))));
          const a = right.x - p.x, b = right.y - p.y;
          const c = up.x - p.x, d = up.y - p.y;
          if (Math.abs(a * d - b * c) < .04) continue;
          const facing = Math.abs(rotate(item.normal).z);
          ctx.globalAlpha = pose.alpha * (.68 + Math.min(.32, facing * .32));
          ctx.setTransform(a * dpr, b * dpr, c * dpr, d * dpr, p.x * dpr, p.y * dpr);
          ctx.drawImage(item.image, -.5, -.5, 1, 1);
        }
        ctx.globalAlpha = 1;

      }

      function pauseForInspection() {
        clearTimeout(resumeTimer);
        inspectionPaused = true;
        canvas.dataset.motion = 'paused';
      }
      function scheduleResume() {
        clearTimeout(resumeTimer);
        resumeTimer = setTimeout(() => {
          if (pointers.size === 0) resumeButton.click();
        }, 1000);
      }
      // The invisible button is triggered one second after the final touch or mouse release.
      resumeButton.addEventListener('click', () => {
        inspectionPaused = false;
        canvas.dataset.motion = 'running';
      });

      canvas.addEventListener('pointerdown', event => {
        pauseForInspection();
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (pointers.size === 1) {
          dragging = true;
          lastX = event.clientX;
          lastY = event.clientY;
        } else {
          dragging = false;
          const [first, second] = [...pointers.values()];
          pinchDistance = Math.hypot(first.x - second.x, first.y - second.y);
        }
        canvas.setPointerCapture(event.pointerId);
      });
      canvas.addEventListener('pointermove', event => {
        if (!pointers.has(event.pointerId)) return;
        pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });
        if (pointers.size > 1) {
          const [first, second] = [...pointers.values()];
          const span = Math.hypot(first.x - second.x, first.y - second.y);
          if (pinchDistance > 0 && span > 0) {
            distance = clamp(distance * pinchDistance / span, DIST_MIN, DIST_MAX);
          }
          pinchDistance = span;
          return;
        }
        if (!dragging) return;
        angle += (event.clientX - lastX) * .008;
        tilt = clamp(tilt + (event.clientY - lastY) * .005, TILT_MIN, TILT_MAX);
        lastX = event.clientX;
        lastY = event.clientY;
      });
      function endPointer(event) {
        pointers.delete(event.pointerId);
        pinchDistance = 0;
        dragging = pointers.size === 1;
        if (dragging) {
          const remaining = [...pointers.values()][0];
          lastX = remaining.x;
          lastY = remaining.y;
        } else {
          scheduleResume();
        }
      }
      canvas.addEventListener('pointerup', endPointer);
      canvas.addEventListener('pointercancel', endPointer);
      canvas.addEventListener('wheel', event => {
        event.preventDefault();
        pauseForInspection();
        distance = clamp(distance + event.deltaY * .008, DIST_MIN, DIST_MAX);
        scheduleResume();
      }, { passive: false });
      introButton.addEventListener('click', () => dismissIntro(performance.now()));
      addEventListener('blur', () => {
        pointers.clear();
        dragging = false;
        if (inspectionPaused) scheduleResume();
      });

      // ---------- Playlist & player ----------
      // Edit titles/artists freely; `src` must match the MP3 file names beside index.html.
      const TRACKS = [
        { src: 'Taylor Swift - Down Bad (Official Lyric Video).mp3', title: 'Ang cold mo be', artist: 'Chan' },
        { src: 'LANY - good guys (official video).mp3', title: 'good guys', artist: 'LANY' },
        { src: 'Rob Deniel - Miss Miss (Official Lyric Visualizer).mp3', title: 'Miss Miss', artist: 'Rob Deniel' },
        { src: 'ALAM KO - JOHN ROA OFFICIAL MUSIC VIDEO.mp3', title: 'Alam Ko', artist: 'John Roa' },
        { src: 'Kung Ayaw - Jan Roberts (Official Visualizer).mp3', title: 'Kung Ayaw', artist: 'Jan Roberts' },
        { src: 'will rants about bare minimum (nag-eeffort nga ba talaga siya).mp3', title: 'will rants about bare minimum', artist: 'nag-eeffort nga ba talaga siya' },
      ];
      const wideScreen = matchMedia('(min-width: 900px)');
      const items = [];
      const missing = new Set();
      let index = 0;
      let wantPlaying = false;
      let scrubbing = false;

      TRACKS.forEach((track, i) => {
        const li = document.createElement('li');
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'track';
        button.innerHTML = '<span class="idx"></span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>' +
          '<span class="t-meta"><span class="t-title"></span><span class="t-artist"></span></span>';
        button.querySelector('.idx').textContent = String(i + 1);
        button.querySelector('.t-title').textContent = track.title;
        button.querySelector('.t-artist').textContent = track.artist;
        button.addEventListener('click', () => (i === index ? togglePlay() : loadTrack(i, true)));
        li.append(button);
        playlistList.append(li);
        items.push(button);
      });
      playlistCount.textContent = String(TRACKS.length);

      const formatTime = value => {
        if (!Number.isFinite(value) || value < 0) return '0:00';
        const seconds = Math.floor(value);
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
      };
      function paintSeek(fraction) {
        seek.value = String(Math.round(fraction * 1000));
        seek.style.setProperty('--p', `${fraction * 100}%`);
      }
      function updatePlayer() {
        const length = song.duration, now = song.currentTime;
        const known = Number.isFinite(length) && length > 0;
        if (!scrubbing) {
          elapsedLabel.textContent = formatTime(now);
          paintSeek(known ? clamp01(now / length) : 0);
        }
        durationLabel.textContent = known ? formatTime(length) : '0:00';
        seek.disabled = !known;
        const playing = !song.paused && !song.ended;
        dock.classList.toggle('is-playing', playing);
        toggleAudioButton.setAttribute('aria-label', playing ? 'Pause' : 'Play');
        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
      }
      function revealActive() {
        if (!playlist.classList.contains('open')) return;
        const row = items[index].parentElement;
        const top = row.offsetTop, bottom = top + row.offsetHeight;
        if (top < playlistList.scrollTop) playlistList.scrollTop = Math.max(0, top - 4);
        else if (bottom > playlistList.scrollTop + playlistList.clientHeight) {
          playlistList.scrollTop = bottom - playlistList.clientHeight + 4;
        }
      }
      function markActive() {
        items.forEach((button, i) => {
          button.classList.toggle('active', i === index);
          button.classList.toggle('missing', missing.has(i));
          if (i === index) button.setAttribute('aria-current', 'true');
          else button.removeAttribute('aria-current');
        });
        revealActive();
      }
      function updateMediaSession() {
        if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
        const track = TRACKS[index];
        navigator.mediaSession.metadata = new MediaMetadata({ title: track.title, artist: track.artist, album: 'Lorilay!' });
      }
      function play() {
        wantPlaying = true;
        const promise = song.play();
        if (promise && promise.catch) {
          promise.catch(error => {
            // Aborted/unsupported loads are handled by the track-skipping logic below.
            if (error && error.name === 'NotAllowedError') { wantPlaying = false; updatePlayer(); }
          });
        }
      }
      function loadTrack(next, autoplay = false) {
        index = (next + TRACKS.length) % TRACKS.length;
        const track = TRACKS[index];
        missing.delete(index);
        song.src = encodeURI(track.src);
        song.load();
        titleLabel.textContent = track.title;
        artistLabel.textContent = track.artist;
        paintSeek(0);
        elapsedLabel.textContent = '0:00';
        durationLabel.textContent = '0:00';
        markActive();
        updateMediaSession();
        if (autoplay) play();
        updatePlayer();
      }
      function togglePlay() {
        if (song.paused || song.ended) {
          if (song.ended) song.currentTime = 0;
          play();
        } else {
          wantPlaying = false;
          song.pause();
        }
      }
      function previousTrack() {
        if (song.currentTime > 3) song.currentTime = 0;
        else loadTrack(index - 1, wantPlaying || !song.paused);
      }
      const nextTrack = () => loadTrack(index + 1, wantPlaying || !song.paused);

      function setPlaylist(open) {
        playlist.classList.toggle('open', open);
        playlist.inert = !open;
        listButton.setAttribute('aria-expanded', String(open));
        listButton.setAttribute('aria-label', open ? 'Hide playlist' : 'Show playlist');
        if (open) setTimeout(revealActive, 420);
      }

      startAudioButton.addEventListener('click', () => {
        startExperience();                 // bloom + motion begin here, and only here
        startAudioButton.hidden = true;
        soundHint.hidden = true;
        miniPlayer.hidden = false;
        if (wideScreen.matches) setPlaylist(true);
        play();
        updatePlayer();
      });
      toggleAudioButton.addEventListener('click', togglePlay);
      prevButton.addEventListener('click', previousTrack);
      nextButton.addEventListener('click', nextTrack);
      listButton.addEventListener('click', () => setPlaylist(!playlist.classList.contains('open')));
      playlistClose.addEventListener('click', () => { setPlaylist(false); listButton.focus(); });
      playlist.addEventListener('keydown', event => {
        if (event.key === 'Escape') { setPlaylist(false); listButton.focus(); }
      });
      addEventListener('keydown', event => {
        if (event.code === 'Space' && started && event.target === document.body) {
          event.preventDefault();
          togglePlay();
        }
      });

      // Slider: preview while dragging, jump when released.
      seek.addEventListener('input', () => {
        scrubbing = true;
        const fraction = seek.value / 1000;
        elapsedLabel.textContent = formatTime(fraction * song.duration);
        seek.style.setProperty('--p', `${fraction * 100}%`);
      });
      seek.addEventListener('change', () => {
        if (Number.isFinite(song.duration)) song.currentTime = seek.value / 1000 * song.duration;
        scrubbing = false;
        updatePlayer();
      });

      // When a song ends, go straight to the next one; after the last, loop back to the first.
      song.addEventListener('ended', () => loadTrack(index + 1, true));
      song.addEventListener('error', () => {
        if (!song.getAttribute('src')) return;
        missing.add(index);
        markActive();
        if (missing.size >= TRACKS.length) {
          wantPlaying = false;
          artistLabel.textContent = 'audio files not found';
          updatePlayer();
        } else if (wantPlaying) {
          loadTrack(index + 1, true);    // skip a file that can't be loaded
        }
      });
      ['loadedmetadata', 'durationchange', 'timeupdate', 'play', 'pause', 'ended'].forEach(name =>
        song.addEventListener(name, updatePlayer));

      if ('mediaSession' in navigator) {
        const handlers = {
          play: () => play(),
          pause: () => { wantPlaying = false; song.pause(); },
          previoustrack: previousTrack,
          nexttrack: nextTrack,
        };
        Object.entries(handlers).forEach(([action, handler]) => {
          try { navigator.mediaSession.setActionHandler(action, handler); } catch { /* unsupported action */ }
        });
      }

      // ---------- Hand-swipe control (front camera + MediaPipe hand tracking) ----------
      // Swipe your hand across the camera: to your right = next song, to your left = previous.
      // Needs HTTPS (or localhost) and the page open in front. Video never leaves the phone.
      const gestureButton = document.getElementById('toggle-gesture');
      const note = document.getElementById('gesture-note');
      const MP_BASE = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3';
      const HAND_MODEL = 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task';
      const SWIPE_RIGHT_IS_NEXT = true;   // set false to flip the direction
      const SWIPE_DISTANCE = .26;         // share of the camera width the hand must cross...
      const SWIPE_WINDOW_MS = 450;        // ...within this time
      const SWIPE_COOLDOWN_MS = 1100;     // pause after a swipe so the hand coming back doesn't count
      let landmarker = null, stream = null, video = null;
      let gestureOn = false, gestureBusy = false, lastVideoTime = -1, cooldownUntil = 0, noteTimer = 0;
      let trail = [];

      function showNote(text, ms = 2200) {
        note.textContent = text;
        note.classList.add('show');
        clearTimeout(noteTimer);
        noteTimer = setTimeout(() => note.classList.remove('show'), ms);
      }
      async function loadLandmarker() {
        if (landmarker) return landmarker;
        const { FilesetResolver, HandLandmarker } = await import(MP_BASE);
        const files = await FilesetResolver.forVisionTasks(`${MP_BASE}/wasm`);
        const options = delegate => ({
          baseOptions: { modelAssetPath: HAND_MODEL, delegate },
          runningMode: 'VIDEO',
          numHands: 1,
        });
        try { landmarker = await HandLandmarker.createFromOptions(files, options('GPU')); }
        catch { landmarker = await HandLandmarker.createFromOptions(files, options('CPU')); }
        return landmarker;
      }
      function stopGesture() {
        gestureOn = false;
        if (stream) stream.getTracks().forEach(track => track.stop());
        stream = null;
        if (video) { video.srcObject = null; video.remove(); video = null; }
        trail = [];
        gestureButton.classList.remove('seen');
        gestureButton.setAttribute('aria-pressed', 'false');
        gestureButton.setAttribute('aria-label', 'Turn on hand swipe control');
      }
      async function startGesture() {
        if (gestureBusy) return;
        gestureBusy = true;
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            throw new Error(isSecureContext ? 'nocamera' : 'https');
          }
          showNote('starting camera…', 15000);
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 30 } },
            audio: false,
          });
          video = document.createElement('video');
          video.muted = true;
          video.playsInline = true;
          video.setAttribute('playsinline', '');
          video.style.cssText = 'position:fixed;width:1px;height:1px;opacity:.01;pointer-events:none;left:0;top:0';
          video.srcObject = stream;
          document.body.append(video);
          await video.play();
          await loadLandmarker();
          gestureOn = true;
          lastVideoTime = -1;
          cooldownUntil = 0;
          trail = [];
          gestureButton.setAttribute('aria-pressed', 'true');
          gestureButton.setAttribute('aria-label', 'Turn off hand swipe control');
          showNote('swipe your hand to change songs', 3000);
          requestAnimationFrame(gestureLoop);
        } catch (error) {
          stopGesture();
          showNote(error.message === 'https' ? 'camera needs an https page' :
            error.name === 'NotAllowedError' ? 'camera access was blocked' : 'hand control unavailable', 3500);
        }
        gestureBusy = false;
      }
      function gestureLoop() {
        if (!gestureOn) return;
        requestAnimationFrame(gestureLoop);
        if (!video || video.readyState < 2 || video.currentTime === lastVideoTime) return;
        lastVideoTime = video.currentTime;
        const now = performance.now();
        const result = landmarker.detectForVideo(video, now);
        const hand = result.landmarks && result.landmarks[0];
        gestureButton.classList.toggle('seen', !!hand);
        if (!hand) { trail.length = 0; return; }
        let x = 0, y = 0;
        for (const i of [0, 5, 9, 13, 17]) { x += hand[i].x; y += hand[i].y; } // palm centre
        x /= 5; y /= 5;
        trail.push({ t: now, x, y });
        while (trail.length && now - trail[0].t > SWIPE_WINDOW_MS) trail.shift();
        if (now < cooldownUntil || trail.length < 4) return;
        const dx = x - trail[0].x, dy = y - trail[0].y;
        if (Math.abs(dx) < SWIPE_DISTANCE || Math.abs(dy) > Math.abs(dx) * .75) return;
        cooldownUntil = now + SWIPE_COOLDOWN_MS;
        trail.length = 0;
        // The raw front-camera frame is mirrored relative to you: moving right makes x smaller.
        const toYourRight = dx < 0;
        if (toYourRight === SWIPE_RIGHT_IS_NEXT) { loadTrack(index + 1, true); showNote('next ›', 1200); }
        else { loadTrack(index - 1, true); showNote('‹ previous', 1200); }
      }
      gestureButton.addEventListener('click', () => {
        if (gestureOn) { stopGesture(); showNote('hand control off', 1500); }
        else startGesture();
      });
      document.addEventListener('visibilitychange', () => { if (document.hidden && gestureOn) stopGesture(); });

      loadTrack(0, false);
      addEventListener('resize', resize);
      resize();
      requestAnimationFrame(paint);
    })();
  </script>
<script>
// Anonymous analytics: cumulative active time makes retries idempotent.
(() => {
  const uuid = () => crypto.randomUUID ? crypto.randomUUID() : '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, c => (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16));
  let device;
  try { device = localStorage.getItem('scene-device-id'); if (!device) { device = uuid(); localStorage.setItem('scene-device-id', device); } } catch { device = uuid(); }
  let visit = uuid(), seconds = 0, last = performance.now(), visible = !document.hidden;
  function sample() { const now = performance.now(); if (visible) seconds += Math.min(30, (now-last)/1000); last = now; }
  function send() {
    sample();
    const body = JSON.stringify({device,visit,seconds:Math.floor(seconds)});
    const blob = new Blob([body], {type:'application/json'});
    if (!navigator.sendBeacon || !navigator.sendBeacon('tracker.php',blob)) fetch('tracker.php',{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:true}).catch(()=>{});
  }
  send(); setInterval(send,15000);
  document.addEventListener('visibilitychange',()=>{send();visible=!document.hidden;last=performance.now();});
  addEventListener('pagehide',()=>{send();visible=false;});
  addEventListener('pageshow',event=>{if(event.persisted){visit=uuid();seconds=0;last=performance.now();visible=!document.hidden;send();}});
})();
</script>
