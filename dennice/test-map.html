<!doctype html><html lang="en"><meta charset="utf-8"><title>Cursed Land animation QA</title>
<style>body{background:#151019;color:#e7dfef;font:16px monospace;margin:20px}canvas{width:min(100%,1216px);image-rendering:pixelated;border:1px solid #635872}button{padding:12px;margin:8px}pre{white-space:pre-wrap}</style>
<h1>Cursed Land — original asset animations</h1>
<button id="toggle">Pause map</button><button id="test">Run animation checks</button><a href="index.html?dev=1">Play boss fight</a>
<pre id="results">Loading all eight original atlases…</pre><canvas id="view" width="608" height="400"></canvas>
<script>var phase='boss',boss={art:'adapted'},time=0;window.ARENA_MAPS={};window.ARENA_MAP_CROPS={};function draw(){}</script>
<script src="assets/cursed-land/map-data.js?v=real-animations-1"></script><script src="arena-map.js?v=real-animations-1"></script>
<script>
const map=window.PRINCESS_MAP,view=document.querySelector('canvas'),ctx=view.getContext('2d'),out=document.querySelector('#results');
let paused=false,last=performance.now(),tested=false;
document.querySelector('#toggle').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume map':'Pause map'};
function pixelsAt(t){map.renderAt(t);return map.surface.getContext('2d').getImageData(0,0,608,400).data}
function different(a,b){let n=0;for(let i=0;i<a.length;i+=4)if(a[i]!==b[i]||a[i+1]!==b[i+1]||a[i+2]!==b[i+2]||a[i+3]!==b[i+3])n++;return n}
function tests(){
  if(!map.renderAt(0))return;
  let checks=0;
  function assert(value,label){if(!value)throw Error(label);checks++}
  for(const s of CURSED_LAND_DATA.tilesets)for(const frames of Object.values(s.animations)){
    let elapsed=0;
    for(const [id,duration]of frames){assert(id>=0&&id<s.count,'frame outside atlas');assert(map.frameAt(frames,elapsed)===id,'boundary timing');assert(map.frameAt(frames,elapsed+duration-0.01)===id,'frame duration');elapsed+=duration;}
    assert(map.frameAt(frames,elapsed)===frames[0][0],'loop boundary');
  }
  const first=pixelsAt(0),changed=[];
  for(let i=1;i<6;i++){const diff=different(first,pixelsAt(i*.15+.001));assert(diff>0,'visible frame '+i);changed.push(diff)}
  assert(different(first,pixelsAt(9))===0,'9 second shared animation loop');
  const before=map.stats().renderCount;map.renderAt(9);assert(before===map.stats().renderCount,'paused/same-frame cache');
  assert(map.stats().loadedAtlases===8,'all atlases loaded');assert(map.stats().animatedPlacements===284,'all authored animated placements');
  out.textContent='PASS: '+checks+' checks. All 487 definitions / 284 placed tiles / 32 layers.\nChanged native pixels across frames: '+changed.join(', ')+'.\nOriginal 150ms and 1500ms timing; exact loop; unchanged frame cached.\nStatic plants and rocks are the original artwork, not invented animations.';
}
document.querySelector('#test').onclick=()=>{try{tests()}catch(e){out.textContent='FAIL: '+e.stack}};
function tick(now){const dt=Math.min(.1,(now-last)/1000);last=now;if(!paused)time+=dt;
  if(map.renderAt(time)){ctx.clearRect(0,0,608,400);ctx.drawImage(map.surface,0,0);if(!tested){tested=true;document.querySelector('#test').click()}}
  else if(map.stats().failedAtlases.length)out.textContent='FAILED ASSETS: '+map.stats().failedAtlases.join(', ');
  requestAnimationFrame(tick);
}requestAnimationFrame(tick);
</script></html>
